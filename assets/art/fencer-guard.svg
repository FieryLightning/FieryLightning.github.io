<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="currentColor">
  <title>Sabre fencer en garde, facing right</title>
  <desc>A masked sabreur waits with bent knees, the rear hand resting on the hip and the sword arm bent in front of the chest. A curved knuckle guard protects the glove; the straight blade points forward and upward.</desc>
  <g id="fencer-guard-figure" fill="currentColor">
    <!-- Turned-out rear leg: full breeches, a close-fitting sock, a flat shoe. -->
    <path d="M53 59 C58 58 63 63 60 69
      C55 77 42 86 33 92 L33 95 L31 96
      C29 102 29 108 30 113 L21 114
      C20 108 19 101 21 95 L19 94
      C17 89 20 84 25 81 L45 63 Q49 60 53 59Z"/>
    <path d="M21 110 Q26 109 30 112 L34 115
      Q36 118 32 118 H10 Q8 118 9 115 L19 112Z"/>
    <!-- Forward thigh and bent knee taper into the shin. -->
    <path d="M61 60 C67 59 73 61 79 65 L100 80
      C104 83 105 87 103 92 L98 108 L97 113 L88 113
      C88 105 90 98 92 91 C81 87 69 79 60 74
      C54 71 55 63 61 60Z"/>
    <path d="M88 109 L97 110 Q99 112 103 113 L111 115
      Q114 116 114 118 H88 Q85 117 85 115Z"/>
    <!-- Free elbow opens behind the jacket; the glove settles on the hip. -->
    <path transform="translate(0 -6)" d="M59 41 C53 40 47 43 43 48
      C40 52 38 57 40 61 C42 66 46 71 50 73
      L55 75 Q59 74 58 71 Q58 69 55 68 L50 65 L46 58
      Q49 52 55 50 L62 48Z"/>
    <!-- Fitted jacket and the protective bib below the mask. -->
    <path transform="translate(0 -6)" d="M62 38 C67 37 73 39 76 43
      C79 48 77 54 75 60 L71 70 L72 76
      Q61 80 50 73 L54 54 C54 47 56 41 62 38Z"/>
    <path transform="translate(0 -6)" d="M61 33 Q67 36 73 33 L73 39 Q68 44 60 40 L58 35Z"/>
    <!-- A bent sword arm, with a rounded elbow and a tapered forearm. -->
    <path d="M71 35 C76 34 79 39 82 44 L88 53 L103 45
      Q106 43 109 46 L110 50 L90 62
      C86 65 82 63 79 58 L70 45 Q67 40 71 35Z"/>
    <!-- The two open mesh cells remain clear at the player-card size. -->
    <path fill-rule="evenodd" transform="translate(0 -6)" d="M62 16 C66 13 72 15 75 20
      C77 24 77 29 75 33 Q72 37 65 35
      C61 34 58 31 58 27 C57 22 59 18 62 16Z
      M69 21 L72 22 L71 25 L68 24Z
      M70 28 L73 29 L72 32 L69 31Z"/>
    <!-- A single sabre assembly: grip, glove, bell, knuckle bow and blade. -->
    <g transform="translate(109 47) rotate(-29)">
      <path d="M5 -2 L7 1 L-6 7 Q-8 8 -9 5Z"/>
      <path d="M-5 -3 Q-2 -5 2 -4 L5 -2 L5 3
        Q1 6 -3 4 L-6 2Z"/>
      <path d="M7 -5 C10 -2 9 2 7 5 M7 -5
        C13 -1 13 6 8 9 C3 12 -4 10 -7 6"
        fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 -2.1 L82 -2.1 L89 -0.8 L82 0.8 L9 0.8Z"/>
    </g>
  </g>
</svg>
