<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="currentColor">
  <title>Sabre fencer in a full lunge, facing right</title>
  <desc>The same sabreur lunges forward with the rear foot planted, rear leg straight, front knee over the ankle and torso inclined forward. The sword arm extends at shoulder height behind a curved knuckle guard, while the free arm relaxes down and back.</desc>
  <g id="fencer-lunge-figure" fill="currentColor">
    <!-- The rear leg extends on one line from the hip to the planted foot. -->
    <path d="M79 76 C84 74 90 77 91 82
      C91 86 87 89 81 92 L59 103 Q57 104 55 103
      L30 113 L21 113 L47 96 L48 94 L74 78 Q77 76 79 76Z"/>
    <path d="M21 110 Q26 109 30 112 L34 115
      Q36 118 32 118 H10 Q8 118 9 115 L19 112Z"/>
    <!-- Rounded breeches above a vertical front shin; the knee stays over the ankle. -->
    <path d="M82 76 C88 75 95 77 101 78 L122 81
      C128 82 132 86 132 92 L132 108 L133 113 L123 114
      C121 107 121 100 122 92 C110 91 97 91 85 87
      C79 85 76 80 82 76Z"/>
    <path d="M123 110 L132 110 Q134 112 139 113 L147 115
      Q150 116 151 118 H123 Q120 117 120 115Z"/>
    <!-- The free arm falls down and back, with daylight above the rear thigh. -->
    <path d="M91 51 C87 51 84 55 80 60 L72 68 L58 75
      Q54 77 56 81 Q57 84 61 82 L77 75
      C86 69 91 65 96 60 Q100 56 96 53Z"/>
    <!-- The jacket leans forward from the hips without folding at the waist. -->
    <path d="M101 50 C107 49 112 52 111 57
      C108 65 102 74 98 82 Q89 89 76 82
      C77 75 82 66 86 58 Q91 50 101 50Z"/>
    <path d="M100 46 Q108 49 114 46 L113 51 L107 57 L99 53 L99 48Z"/>
    <!-- Shoulder, elbow and wrist align along the fully extended sword arm. -->
    <path d="M104 50 C115 50 126 49 135 48 L146 47
      Q150 46 153 49 L152 54 C143 55 130 57 118 58
      L105 59 C101 59 100 53 104 50Z"/>
    <path fill-rule="evenodd" transform="translate(39 13) rotate(8 67 25)"
      d="M62 16 C66 13 72 15 75 20
      C77 24 77 29 75 33 Q72 37 65 35
      C61 34 58 31 58 27 C57 22 59 18 62 16Z
      M69 21 L72 22 L71 25 L68 24Z
      M70 28 L73 29 L72 32 L69 31Z"/>
    <!-- Identical weapon and glove, now nearly horizontal and fully advanced. -->
    <g transform="translate(150 50) rotate(-3)">
      <path d="M5 -2 L7 1 L-6 7 Q-8 8 -9 5Z"/>
      <path d="M-5 -3 Q-2 -5 2 -4 L5 -2 L5 3
        Q1 6 -3 4 L-6 2Z"/>
      <path d="M7 -5 C10 -2 9 2 7 5 M7 -5
        C13 -1 13 6 8 9 C3 12 -4 10 -7 6"
        fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 -2.1 L82 -2.1 L89 -0.8 L82 0.8 L9 0.8Z"/>
    </g>
  </g>
</svg>
