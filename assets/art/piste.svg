<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1400" height="150" viewBox="0 0 1400 150" role="img" aria-labelledby="piste-title piste-desc">
  <title id="piste-title">Regulation fencing piste</title>
  <desc id="piste-desc">A 14 metre by 1.5 metre piste, drawn at one unit per centimetre. Centre at 700; en garde lines at 500 and 900. Red hatched warning zones occupy the final two metres at either end.</desc>
  <defs>
    <pattern id="piste-hatch" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M-6 6 6-6M0 24 24 0M18 30 30 18" fill="none" stroke="#ff2d55" stroke-width="3" stroke-opacity="0.24"/>
    </pattern>
  </defs>
  <path d="M0 0H1400V150H0Z" fill="#0a0f17" fill-opacity="0.7"/>
  <g fill="#ff2d55" fill-opacity="0.06">
    <path d="M0 0H200V150H0Z"/>
    <path d="M1200 0H1400V150H1200Z"/>
  </g>
  <g fill="url(#piste-hatch)">
    <path d="M0 0H200V150H0Z"/>
    <path d="M1200 0H1400V150H1200Z"/>
  </g>
  <path d="M0 0H1400M0 150H1400M0 0V150M1400 0V150M500 0V150M700 0V150M900 0V150" fill="none" stroke="#7fe3ff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
